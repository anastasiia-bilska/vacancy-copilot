name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
      - name: requirements.txt matches uv.lock
        # The Space installs from requirements.txt; its first line (CPU torch index) is added by hand.
        run: |
          diff <(grep -v -e '^#' -e '^--extra-index-url' requirements.txt) \
               <(uv export --no-hashes --no-dev --frozen -q | grep -v '^#')
          grep -qx -- '--extra-index-url https://download.pytorch.org/whl/cpu' requirements.txt
