[project]
name = "vacancy-copilot"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gradio>=6.32.0",
    "huggingface-hub>=2.4.0",
    "lancedb>=0.41.0",
    "numpy>=2.5.5",
    "psycopg[binary]>=3.2",
    "pyarrow>=17",
    "sentence-transformers>=6.3.0",
    "transformers>=4.44",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
